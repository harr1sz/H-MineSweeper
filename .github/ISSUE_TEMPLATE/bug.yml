name: Bug report
description: Report a reproducible defect with user impact and evidence.
title: "[Bug] "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include session tokens, board seeds, or private telemetry data.
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected, what they cannot do, and whether data or a result may be wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest reliable sequence, expected result, and actual result.
      placeholder: |
        1. Open…
        2. Start…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots, browser/device, region, app version, and frequency.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable conditions that prove the defect is fixed.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: Identify data, protocol, privacy, compatibility, or release risk and the safe rollback.
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, room codes, tokens, and full IP addresses.
          required: true
