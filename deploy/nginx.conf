worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format privacy
    '$time_iso8601 method=$request_method status=$status '
    'bytes=$body_bytes_sent duration=$request_time request_id=$request_id';
  access_log /dev/stdout privacy;
  error_log /dev/stderr crit;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-store";
  }

  # Docker's embedded DNS is queried at runtime. Keeping the upstream in a
  # shared zone lets the static solo surface start and remain healthy even
  # while the optional server container is temporarily absent.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  upstream h_minesweeper_server {
    zone h_minesweeper_server 64k;
    server server:3001 resolve;
    keepalive 32;
  }

  server {
    listen 8080;
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    ssl_certificate /run/secrets/hms_tls_certificate;
    ssl_certificate_key /run/secrets/hms_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HMS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:" always;
    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /web-healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","surface":"web"}';
    }

    location = /live {
      proxy_pass http://h_minesweeper_server;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
      proxy_pass http://h_minesweeper_server;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /version {
      proxy_pass http://h_minesweeper_server;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://h_minesweeper_server;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
      proxy_pass http://h_minesweeper_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location ^~ /realtime/ {
      proxy_pass http://h_minesweeper_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 75s;
      proxy_send_timeout 15s;
      proxy_buffering off;
    }

    location ^~ /assets/ {
      try_files $uri =404;
    }

    location = /index.html {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
